name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify all package versions match the release
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          for (const directory of ['connect', 'vite', 'storybook']) {
            const path = `packages/${directory}/package.json`;
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            if (pkg.private || pkg.version !== version) {
              throw new Error(
                `${path}: expected a public package at ${version}, got ${pkg.version}`
              );
            }
          }
          NODE

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Pack public packages
        run: |
          pnpm --dir packages/connect pack --out "$RUNNER_TEMP/connect.tgz"
          pnpm --dir packages/vite pack --out "$RUNNER_TEMP/vite.tgz"
          pnpm --dir packages/storybook pack --out "$RUNNER_TEMP/addon.tgz"

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11

      - name: Publish public packages
        run: |
          npm publish "$RUNNER_TEMP/connect.tgz" --access public --tag "$NPM_DIST_TAG"
          npm publish "$RUNNER_TEMP/vite.tgz" --access public --tag "$NPM_DIST_TAG"
          npm publish "$RUNNER_TEMP/addon.tgz" --access public --tag "$NPM_DIST_TAG"